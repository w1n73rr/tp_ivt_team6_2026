version: '3.8'

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-master.volumeSizeLimitMB=1024"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-${MINIO_ACCESS_KEY:-local-minio-access}}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-${MINIO_SECRET_KEY:-local-minio-secret-change-before-deploy}}
    ports:
      - "8333:8333"
    volumes:
      - seaweeddata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - spring-network

  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_DB: study_assistant_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d study_assistant_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - spring-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/study_assistant_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - JWT_SECRET=${JWT_SECRET:-local-dev-only-secret-key-with-at-least-32-bytes}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - S3_ENDPOINT=${S3_ENDPOINT:-${MINIO_ENDPOINT:-http://seaweedfs:8333}}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-${MINIO_ACCESS_KEY:-local-minio-access}}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-${MINIO_SECRET_KEY:-local-minio-secret-change-before-deploy}}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-${MINIO_BUCKET_NAME:-materials}}
    depends_on:
      seaweedfs:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - spring-network

volumes:
  seaweeddata:
  pgdata:

networks:
  spring-network:
    driver: bridge
