spring.application.name=TY3
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.port=8080


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN

spring.config.import=optional:file:.env[.properties]

springdoc.swagger-ui.url=/backend-api.yaml
springdoc.swagger-ui.disable-swagger-default-url=true
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=true
materials.cleanup-delay-ms=${MATERIALS_CLEANUP_DELAY_MS:60000}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Настройки S3-совместимого хранилища
s3.endpoint=${S3_ENDPOINT:${MINIO_ENDPOINT:${MinIo_endpoint:http://localhost:8333}}}
s3.access-key=${S3_ACCESS_KEY}
s3.secret-key=${S3_SECRET_KEY}
s3.bucket-name=${S3_BUCKET_NAME:${MINIO_BUCKET_NAME:${MinIo_bucket-name:materials}}}

