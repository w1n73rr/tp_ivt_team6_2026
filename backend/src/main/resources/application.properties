spring.application.name=TY3
server.port=8080


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

spring.config.import=optional:file:.env[.properties]

# Настройки MinIO / S3
minio.endpoint=${MinIo_endpoint}
minio.access-key=${MinIO_access-key}
minio.secret-key=${MinIO_secret-key}
minio.bucket-name=${MinIo_bucket-name}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:21MB}
