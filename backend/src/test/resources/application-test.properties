# No fallback to a developer database or .env. Supply a disposable PostgreSQL explicitly.
spring.config.import=
spring.datasource.url=${TEST_DATABASE_URL}
spring.datasource.username=${TEST_DATABASE_USERNAME}
spring.datasource.password=${TEST_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

jwt.secret=test-only-secret-at-least-32-characters-long
jwt.expiration=3600000
s3.endpoint=http://127.0.0.1:1
s3.access-key=test-only
s3.secret-key=test-only
s3.bucket-name=test-only


