# Isolated database: authentication tests must never migrate the developer's PostgreSQL.
spring.config.import=
spring.datasource.url=jdbc:h2:mem:ty3-tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

jwt.secret=test-only-secret-at-least-32-characters-long
jwt.expiration=3600000


