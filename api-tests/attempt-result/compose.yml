name: attempt-result-api
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: generation_ui_controlled
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:18085:18083"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d generation_ui_controlled"]
      interval: 2s
      retries: 30
  storage:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-master.volumeSizeLimitMB=32"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    tmpfs:
      - /data
  backend:
    build:
      context: ../..
      dockerfile: api-tests/attempt-result/Dockerfile
    network_mode: service:db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/generation_ui_controlled
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRATION: 86400000
      S3_ENDPOINT: http://storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BUCKET_NAME: result-api
      SERVER_PORT: 18083
      OPENROUTER_API_KEY: ""
      CLOUDRU_API_KEY: ""
    volumes:
      - gradle:/root/.gradle
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/18083"]
      interval: 5s
      retries: 120
      start_period: 30s
volumes:
  gradle:
