name: Реальная генерация DEV

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-ml-dev
  cancel-in-progress: false

jobs:
  live:
    name: Реальный путь интерфейс → модель → сохранение
    if: github.ref == 'refs/heads/dev'
    environment: DEV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: live-ml-${{ github.run_id }}
      COMPOSE_FILE: docker-compose.yml:compose.ci.yml
      COMPOSE_ENV_FILES: .env.ci.example
    steps:
      - name: Получение принятого кода
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Подготовка Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Сборка одноразового окружения без секрета
        run: docker compose build
      - name: Запуск с ключом только в окружении backend
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then echo 'Добавьте OPENROUTER_API_KEY в Environment DEV'; exit 1; fi
          if [ -z "$OPENROUTER_MODEL" ]; then echo 'Добавьте переменную OPENROUTER_MODEL в Environment DEV'; exit 1; fi
          docker compose up -d --no-build --wait --wait-timeout 300
      - name: Настоящая генерация через браузер и проверка сохранения
        run: ./backend/gradlew -p ui-tests test -Dui.headless=true -Dui.baseUrl=http://localhost:18085 -Dui.includeTags=live-ml --no-daemon --console=plain
      - name: Сохранение отчёта без снимков сетевых данных
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: отчёт-реальная-генерация-dev
          path: |
            ui-tests/build/reports/tests/
            ui-tests/build/test-results/
          retention-days: 7
      - name: Удаление одноразового окружения
        if: always()
        run: docker compose down --remove-orphans
