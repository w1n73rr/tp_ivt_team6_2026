# Последний файл после docker-compose.yml и compose.registry.yml.
# Compose >= 2.24.4. Только новая серверная БД; не добавлять compose.ci.yml.
name: tpivt-server

x-server-defaults: &server-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  seaweedfs:
    <<: *server-defaults
    ports: !reset []
    mem_limit: 768m
    cpus: 1.0

  exam-ai-db:
    <<: *server-defaults
    ports: !reset []
    mem_limit: 768m
    cpus: 1.0

  exam-ai-backend:
    <<: *server-defaults
    build: !reset null
    ports: !reset []
    mem_limit: 1536m
    cpus: 1.5
    environment:
      APP_CORS_ALLOWED_ORIGINS: ${SERVER_ORIGIN:?Set SERVER_ORIGIN to the public HTTP URL}
      S3_ENDPOINT: http://seaweedfs:8333
      SPRING_CONFIG_IMPORT: ""
      SPRING_JPA_SHOW_SQL: "false"
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: WARN
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: INFO
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m -XX:MaxMetaspaceSize=256m

  exam-ai-frontend:
    <<: *server-defaults
    build: !reset null
    ports: !override
      - "0.0.0.0:80:80"
    mem_limit: 128m
    cpus: 0.5
