version: '3.8'

services:
  exam-ai-db:
    image: postgres:16-alpine
    container_name: exam_ai_db_container
    environment:
      POSTGRES_DB: study_assistant_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d study_assistant_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - exam-ai-network

  exam-ai-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exam_ai_backend_container
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://exam-ai-db:5432/study_assistant_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      exam-ai-db:
        condition: service_healthy
    networks:
      - exam-ai-network

  exam-ai-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exam_ai_frontend_container
    ports:
      - "3000:80"
    depends_on:
      - exam-ai-backend
    networks:
      - exam-ai-network

volumes:
  pgdata:

networks:
  exam-ai-network:
    driver: bridge
